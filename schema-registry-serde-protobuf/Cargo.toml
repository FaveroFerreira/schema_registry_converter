[package]
name = "schema-registry-serde-protobuf"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
schema-registry-client = { path = "../schema-registry-client" }
schema-registry-serde = { path = "../schema-registry-serde" }
async-trait = "0.1"
serde = "1.0"
serde_json = "1.0"
thiserror = "2.0"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"
dashmap = "6"
logos = "0.16"
integer-encoding = "4.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
